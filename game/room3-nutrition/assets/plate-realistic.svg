<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="白色陶瓷餐盤">
  <defs>
    <radialGradient id="plate" cx="42%" cy="35%" r="68%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#fbfaf7"/>
      <stop offset="0.76" stop-color="#ece8e1"/>
      <stop offset="0.86" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8d3cb"/>
    </radialGradient>
    <radialGradient id="well" cx="48%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fffefc"/>
      <stop offset="0.74" stop-color="#f7f4ef"/>
      <stop offset="1" stop-color="#e6e1d9"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3a291f" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <ellipse cx="300" cy="330" rx="246" ry="220" fill="#6c4d38" opacity="0.16" filter="url(#soft)"/>
  <circle cx="300" cy="286" r="250" fill="url(#plate)" filter="url(#shadow)"/>
  <circle cx="300" cy="286" r="198" fill="url(#well)" stroke="#ded9d1" stroke-width="7"/>
  <circle cx="300" cy="286" r="218" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.72"/>
  <ellipse cx="242" cy="205" rx="90" ry="42" fill="#ffffff" opacity="0.34" transform="rotate(-18 242 205)"/>
</svg>
